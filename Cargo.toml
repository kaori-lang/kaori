[package]
name = "kaori"
version = "0.1.0"
edition = "2024"

[dependencies]
ariadne = "0.5.1"
logos = "0.16.1"
clap = "4.6.1"
rustc-hash = "2.1.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
incremental = false
overflow-checks = false


[profile.profiling]
inherits = "release"
debug = true
